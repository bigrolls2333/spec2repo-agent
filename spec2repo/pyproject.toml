[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "spec2repo"
version = "0.2.0"
description = "Specification-driven agent backend with verifiable delivery."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.12,<3",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "sqlalchemy>=2.0,<2.1",
    "alembic>=1.14,<2",
    "pymysql[rsa]>=1.1,<2",
    "redis>=5.2,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "ruff>=0.9,<1", "httpx>=0.28,<1"]

[project.scripts]
spec2repo = "spec2repo.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/spec2repo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["mysql: requires an explicitly configured isolated MySQL test database", "redis: requires dedicated Redis integration service", "docker: requires explicit SPEC2REPO_TEST_DOCKER=1 and a built runtime image"]

[tool.ruff]
target-version = "py311"
line-length = 100
