[project]
name = "paper2repo-agent"
version = "0.1.0"
description = "Evidence-backed agent workflow for planning and executing ML paper reproductions."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "langgraph>=0.2.0",
    # 3.1.x expects newer checkpoint-base APIs than LangGraph 1.0.x installs.
    "langgraph-checkpoint-sqlite>=3.0.0,<3.1.0",
    "langchain>=0.3.0",
    "langchain-openai>=0.2.0",
    "pydantic>=2.8.0",
    "typer>=0.12.5",
    "rich>=13.7.1",
    "python-dotenv>=1.0.1",
    "requests>=2.32.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "responses>=0.25.0",
    "ruff>=0.6.0",
]
mysql = [
    "SQLAlchemy>=2.0.0",
    "PyMySQL>=1.1.0",
]

[project.scripts]
paper2repo = "paper2repo_agent.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/paper2repo_agent"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
