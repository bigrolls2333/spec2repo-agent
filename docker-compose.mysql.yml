services:
  mysql:
    image: mysql:8.4
    container_name: paper2repo-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-paper2repo}
      MYSQL_USER: ${MYSQL_USER:-paper2repo}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
    ports:
      - "3306:3306"
    command:
      - "--character-set-server=utf8mb4"
      - "--collation-server=utf8mb4_unicode_ci"
    volumes:
      - paper2repo_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u${MYSQL_USER:-paper2repo}", "-p${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  paper2repo_mysql_data:
